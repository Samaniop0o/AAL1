<!DOCTYPE html>
<html lang="lo" data-theme="light" style="color-scheme: light;"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AA1 – ບ່ອນຊື້ຂາຍໄອດີເກມ</title>
<style>
:root{--bg:#0f1117;--card:#171a23;--line:#2a2f3c;--tx:#f1f3f7;--mut:#9aa3b5;--red:#dc2626;--pink:#ec4899;--green:#34d399;--gold:#facc15;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}html,body{margin:0}
body{background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Noto Sans Lao","Phetsarath OT",sans-serif;padding-bottom:84px}
header{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:14px 16px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.logo{display:flex;align-items:center;gap:8px;color:var(--pink);font-weight:800;font-size:26px}
.logo i{width:34px;height:24px;background:var(--pink);border-radius:12px 12px 8px 8px;display:inline-block}
.hb{display:flex;gap:8px;flex-wrap:wrap}
button{font:inherit;cursor:pointer;border:0;color:var(--tx)}
.pill{padding:8px 14px;border-radius:10px;font-weight:600;font-size:14px;background:#1c2030;border:1px solid var(--line)}
.pill.a{color:var(--gold);border-color:#6b5a1a}.pill.r{background:var(--red);border-color:var(--red)}
main{padding:20px 16px;max-width:640px;margin:auto}
h1{font-size:22px;margin:4px 0 18px}
.tabs{display:flex;gap:8px;margin-bottom:16px}
.tabs button{padding:7px 14px;border-radius:20px;background:#1c2030;border:1px solid var(--line);font-size:14px}
.tabs button.on{background:var(--pink);border-color:var(--pink)}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;overflow:hidden;margin-bottom:18px}
.img{aspect-ratio:16/8.5;background:linear-gradient(135deg,#b45309,#f59e0b 50%,#7c2d12);background-size:cover;background-position:center;display:flex;align-items:center;justify-content:center;font-size:48px}
.img.ff{background:linear-gradient(135deg,#7f1d1d,#f97316 60%,#facc15)}
.body{padding:18px}
.tag{display:inline-block;background:#3b1519;color:#f87171;padding:5px 12px;border-radius:8px;font-size:13px;font-weight:600}
.body h3{margin:12px 0 8px;font-size:19px}.price{color:var(--green);font-weight:700;font-size:19px;margin-bottom:14px}
.buy{width:100%;background:var(--red);padding:14px;border-radius:12px;font-weight:700;font-size:16px}
.sold{opacity:.55}.sold .buy{background:#444}
nav{position:fixed;bottom:0;left:0;right:0;background:#12151d;border-top:1px solid var(--line);display:flex;justify-content:space-around;padding:8px 0 calc(8px + env(safe-area-inset-bottom,0px))}
nav button{background:none;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:12px;color:var(--mut)}
nav button span{font-size:26px}nav button.on{color:var(--pink)}
.modal{position:fixed;inset:0;background:#000a;display:none;align-items:center;justify-content:center;padding:16px;z-index:9}
.modal.show{display:flex}
.box{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:20px;width:100%;max-width:400px;max-height:90vh;overflow:auto}
.box h2{margin:0 0 14px;font-size:20px}
input,select{width:100%;padding:12px;margin-bottom:10px;border-radius:10px;border:1px solid var(--line);background:#0f1117;color:var(--tx);font:inherit}
.row{display:flex;gap:8px}.row button{flex:1;padding:12px;border-radius:10px;font-weight:600;background:#2a2f3c}
.row .p{background:var(--red)}
.msg{color:#f87171;font-size:14px;min-height:18px;margin-bottom:6px}
.item{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px 0;border-bottom:1px solid var(--line);font-size:14px}
.item small{color:var(--mut)}
.del{background:#3b1519;color:#f87171;padding:6px 10px;border-radius:8px}
.empty{color:var(--mut);text-align:center;padding:40px 0}
.wa{display:block;text-align:center;background:#16a34a;padding:14px;border-radius:12px;font-weight:700;color:#fff;text-decoration:none;margin-top:12px}
.logo img{width:40px;height:40px;border-radius:50%;object-fit:cover;border:2px solid var(--pink)}
.hero{position:relative;height:260px;overflow:hidden;border-bottom:1px solid var(--line)}
.hero img{width:100%;height:100%;object-fit:cover;object-position:50% 25%;display:block}
.hero:after{content:"";position:absolute;inset:0;background:linear-gradient(to top,var(--bg) 2%,#0f111700 60%)}
.hero div{position:absolute;left:16px;bottom:14px;z-index:2;font-size:34px;font-weight:800;color:var(--pink);text-shadow:0 2px 10px #000}
.hero small{display:block;font-size:14px;font-weight:500;color:var(--tx)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.grid .card{margin:0;border-radius:14px}.grid .img{aspect-ratio:4/3;font-size:34px}.grid .body{padding:10px}.grid .tag{font-size:11px;padding:3px 8px}.grid .body h3{font-size:14px;margin:8px 0 4px;line-height:1.35}.grid .price{font-size:15px;margin-bottom:8px}.grid .buy{padding:10px;font-size:14px;border-radius:10px}
</style></head><body>

function buy(id){
 const p=products.find(x=>x.id===id);if(!p)return;cur=null;

const getPhotos=async id=>{const s=await getDocs(collection(db,"products",id,"photos"));return s.docs.map(d=>d.data()).sort((a,b)=>a.i-b.i).map(x=>x.data)};
const clearPhotos=async id=>{const s=await getDocs(collection(db,"products",id,"photos"));await Promise.all(s.docs.map(d=>deleteDoc(d.ref)))};
const loadImg=src=>new Promise((ok,no)=>{const im=new Image();im.onload=()=>ok(im);im.onerror=no;im.src=src});

const readFile=f=>new Promise((ok,no)=>{const r=new FileReader();r.onerror=no;r.onload=()=>ok(r.result);r.readAsDataURL(f)});

  try{
   const c=pcache[id];const g=c&&c.n===p.n?c.g:await getPhotos(id);pcache[id]={n:p.n,g};
   if(cur===id&&g.length){gal=g;gi=0;showDetail(p)}
  }catch(e){if(cur===id){showDetail({...p,n:0})}}
 }
}
function showImg(i){gi=i;$("#big").src=gal[i];document.querySelectorAll(".th").forEach((t,j)=>t.style.borderColor=j===i?"var(--pink)":"transparent")}
function nextImg(){showImg((gi+1)%gal.length)}

/* ---------- Admin ---------- */
function adminPanel(){
 if(!CONFIGURED){open_('<h2>⚙️ Admin</h2><p style="color:var(--mut)">ຍັງບໍ່ໄດ້ໃສ່ຄ່າ Firebase ໃນໄຟລ໌ index.html</p><div class="row"><button onclick="close_()">ປິດ</button></div>');return}
 if(!owner){
  open_(`<h2>⚙️ ເຂົ້າສູ່ລະບົບ Admin</h2><input id="em" type="email" placeholder="ອີເມລ" autocomplete="username"><input id="pw" type="password" placeholder="ລະຫັດຜ່ານ" autocomplete="current-password"><div class="msg" id="e"></div><div class="row"><button onclick="close_()">ຍົກເລີກ</button><button class="p" onclick="doLogin()">ເຂົ້າສູ່ລະບົບ</button></div>`);return;
 }
 if(!editKeep){tmpImgs=[];editId=null}editKeep=false;
 open_(`<h2>⚙️ ຈັດການສິນຄ້າ</h2>
 <input id="n" placeholder="ຊື່ໄອດີ"><select id="g"><option>Roblox</option><option>Free Fire</option></select>
 <input id="pr" type="number" inputmode="numeric" placeholder="ລາຄາ (₭)"><textarea id="d" rows="3" placeholder="ລາຍລະອຽດໄອດີ (ເລເວລ, ຂອງໃນໄອດີ ແລະ ອື່ນໆ)" style="width:100%;padding:12px;margin-bottom:10px;border-radius:10px;border:1px solid var(--line);background:#0f1117;color:var(--tx);font:inherit"></textarea>
 <input id="f" type="file" accept="image/*" multiple onchange="pickImg(this)"><div id="pv" style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px"></div>
 <div class="msg" id="e"></div><div class="row"><button onclick="close_()">ປິດ</button><button class="p" id="addb" onclick="addP()">${editId?"ບັນທຶກການແກ້ໄຂ":"+ ເພີ່ມສິນຄ້າ"}</button></div>
 <h2 style="margin-top:20px;font-size:17px">ສິນຄ້າທັງໝົດ (${products.length})</h2>
 ${products.map(p=>`<div class="item"><div>${esc(p.name)}<br><small>${esc(p.game)} · ${fmt(p.price)}${p.sold?' · ຂາຍແລ້ວ':''}</small></div><div class="row" style="flex:none"><button class="del" style="background:#1c2030;color:var(--tx);flex:none" onclick="togSold('${p.id}')">${p.sold?'ເປີດຂາຍ':'ຂາຍແລ້ວ'}</button><button class="del" style="background:#1c2030;color:var(--tx);flex:none" onclick="editP('${p.id}')">ແກ້ໄຂ</button><button class="del" style="flex:none" onclick="delP('${p.id}')">ລຶບ</button></div></div>`).join("")}
 <div class="row" style="margin-top:16px"><button onclick="doLogout()">ອອກຈາກລະບົບ Admin</button></div>`);
}
async function doLogin(){
 try{const r=await signInWithEmailAndPassword(auth,$("#em").value.trim(),$("#pw").value);
  if(r.user.email!==ADMIN_EMAIL){await signOut(auth);$("#e").textContent="ບັນຊີນີ້ບໍ່ແມ່ນ Admin";return}
  owner=true;close_();render();adminPanel();
 }catch(e){$("#e").textContent="ອີເມລ ຫຼື ລະຫັດຜ່ານບໍ່ຖືກ"}
}
async function doLogout(){await signOut(auth);owner=false;close_();render()}
async function pickImg(el){
 const fs=[...el.files];if(!fs.length)return;const e=$("#e");e.style.color="var(--mut)";
 for(const f of fs){
  if(tmpImgs.length>=20){e.style.color="#f87171";e.textContent="ໃສ່ໄດ້ສູງສຸດ 20 ຮູບ";break}
  e.textContent="ກຳລັງປະມວນຜົນຮູບ... ("+tmpImgs.length+"/20)";
  try{tmpImgs.push(await shrink(await readFile(f),800,.66))}catch(x){}
 }
 el.value="";drawPv();e.style.color="var(--green)";e.textContent="ມີ "+tmpImgs.length+" ຮູບ ✓ (ຮູບທຳອິດເປັນຮູບປົກ)";
}
function drawPv(){const pv=$("#pv");if(!pv)return;pv.innerHTML=tmpImgs.map((u,i)=>`<div style="position:relative"><img src="${u}" style="width:64px;height:48px;object-fit:cover;border-radius:8px;display:block"><button onclick="tmpImgs.splice(${i},1);drawPv()" style="position:absolute;top:-6px;right:-6px;background:#dc2626;border-radius:50%;width:20px;height:20px;font-size:12px;line-height:20px;padding:0">×</button></div>`).join("")}
async function addP(){
 const e=$("#e"),n=$("#n").value.trim(),pr=parseInt($("#pr").value);
 if(!n||!pr){e.style.color="#f87171";e.textContent="ໃສ່ຊື່ ແລະ ລາຄາໃຫ້ຄົບ";return}
 if(busy)return;busy=true;$("#addb").disabled=true;e.style.color="var(--mut)";e.textContent="ກຳລັງບັນທຶກ...";
 try{
  const cover=tmpImgs[0]?await shrink(tmpImgs[0],420,.62):"";
  const id=editId||doc(collection(db,"products")).id;
  const data={game:$("#g").value,name:n,price:pr,desc:$("#d").value.trim(),img:cover,n:tmpImgs.length};
  if(!editId){data.sold=false;data.created=Date.now()}
  if(editId)await clearPhotos(id);
  for(let i=0;i<tmpImgs.length;i++)await setDoc(doc(db,"products",id,"photos",String(i).padStart(2,"0")),{i,data:tmpImgs[i]});
  await setDoc(doc(db,"products",id),data,{merge:true});
  delete pcache[id];editId=null;tmpImgs=[];busy=false;adminPanel();
 }catch(x){busy=false;const b=$("#addb");if(b)b.disabled=false;e.style.color="#f87171";e.textContent="ບັນທຶກບໍ່ສຳເລັດ: "+(x&&x.code||x.message||x)}
}
async function editP(id){
 const p=products.find(x=>x.id===id);if(!p)return;
 editId=id;editKeep=true;tmpImgs=[];adminPanel();
 $("#n").value=p.name;$("#g").value=p.game;$("#pr").value=p.price;$("#d").value=p.desc||"";$("#box").scrollTop=0;
 const e=$("#e");e.style.color="var(--mut)";e.textContent="ກຳລັງໂຫຼດຮູບ...";
 try{tmpImgs=(p.n?await getPhotos(id):[]);drawPv();e.textContent=""}catch(x){e.style.color="#f87171";e.textContent="ໂຫຼດຮູບບໍ່ໄດ້"}
}
async function delP(id){
 if(!confirm("ລຶບສິນຄ້ານີ້?"))return;
 try{await clearPhotos(id);await deleteDoc(doc(db,"products",id));delete pcache[id];editKeep=true;adminPanel()}catch(x){alert("ລຶບບໍ່ສຳເລັດ: "+(x.code||x.message))}
}
async function togSold(id){
 const p=products.find(x=>x.id===id);if(!p)return;
 try{await updateDoc(doc(db,"products",id),{sold:!p.sold});editKeep=true;adminPanel()}catch(x){alert("ບັນທຶກບໍ່ສຳເລັດ: "+(x.code||x.message))}
}
Object.assign(window,{render,close_,buy,detail,showImg,nextImg,adminPanel,doLogin,doLogout,pickImg,drawPv,addP,editP,delP,togSold});
Object.defineProperty(window,"filter",{get:()=>filter,set:v=>{filter=v}});
Object.defineProperty(window,"tmpImgs",{get:()=>tmpImgs});
render();
</script>
</body></html>
